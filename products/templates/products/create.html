{% extends "products/base.html" %}
{% block title %}Tambah Produk{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6 text-gray-800">Tambah Produk</h1>

<form method="post" class="space-y-4">
  {% csrf_token %}
  {{ form.as_p }}

  <div class="flex space-x-3">
    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md">💾 Simpan</button>
    <a href="{% url 'product_list' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">Kembali</a>
  </div>
</form>
{% endblock %}
