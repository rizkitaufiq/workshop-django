<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Product App{% endblock %}</title>

  <!-- ✅ Tailwind CDN (langsung dari web, tidak perlu install) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Optional: Setting warna custom -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6', // biru Tailwind
            danger: '#ef4444', // merah Tailwind
          },
        },
      },
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
