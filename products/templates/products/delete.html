{% extends "products/base.html" %}
{% block title %}Hapus Produk{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4 text-gray-800">Konfirmasi Hapus</h1>
<p class="text-gray-700 mb-4">Apakah kamu yakin ingin menghapus produk <strong>{{ product.name }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <div class="flex space-x-3">
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md">Hapus</button>
    <a href="{% url 'product_list' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">Batal</a>
  </div>
</form>
{% endblock %}
